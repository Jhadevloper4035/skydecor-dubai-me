services:

  nginx:
    image: nginx:1.27-alpine
    container_name: skydecor-nginx-prod
    restart: always
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      frontend:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    container_name: skydecor-frontend-prod
    restart: always
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://app:${PORT:-8080}/api/v1
      NEXT_PUBLIC_BACKEND_URL: http://app:${PORT:-8080}/api/v1
    expose:
      - '3000'
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/', (res) => process.exit(res.statusCode >= 200 && res.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: skydecor-api-prod
    restart: always
    expose:
      - '${PORT:-8080}'
    env_file:
      - .env.production
    networks:
      - app-net
    healthcheck:
      test: wget -qO- http://localhost:$${PORT:-8080}/health || exit 1
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

networks:
  app-net:
    driver: bridge

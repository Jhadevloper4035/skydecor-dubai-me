name: CI/CD

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Manual run mode"
        type: choice
        required: true
        default: deploy
        options:
          - deploy
          - validate-only
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NEXT_PUBLIC_API_BASE_URL: http://app:8080/api/v1
  DOCKERHUB_NAMESPACE: devil4035

jobs:
  validate:
    name: Test and build applications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            forntend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: forntend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Test backend
        run: npm test
        working-directory: backend

      - name: Verify backend runtime imports
        run: node -e "import('./src/index.js')"
        working-directory: backend
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/skydecor_ci
          JWT_SECRET: 0123456789abcdef0123456789abcdef

      - name: Lint frontend
        run: npm run lint
        working-directory: forntend

      - name: Test frontend
        run: npm test
        working-directory: forntend

      - name: Build frontend
        run: npm run build
        working-directory: forntend

  docker-pr:
    name: Validate production Docker images
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: false
          tags: skydecor-dubai-backend:pr-${{ github.event.pull_request.number }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./forntend
          file: ./forntend/Dockerfile
          target: production
          push: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
          tags: skydecor-dubai-frontend:pr-${{ github.event.pull_request.number }}

  publish:
    name: Publish Docker images
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'deploy'))
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
      dockerhub_namespace: ${{ steps.images.outputs.dockerhub_namespace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Docker image names
        id: images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          DOCKERHUB_NAMESPACE="$(printf '%s' "${DOCKERHUB_USERNAME:-${DOCKERHUB_NAMESPACE}}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"

          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "Docker Hub username is empty" >&2
            exit 1
          fi

          if ! echo "$DOCKERHUB_NAMESPACE" | grep -Eq '^[a-z0-9][a-z0-9_.-]*$'; then
            echo "DOCKERHUB_USERNAME must be a Docker Hub username or organization" >&2
            exit 1
          fi

          echo "dockerhub_namespace=$DOCKERHUB_NAMESPACE" >> "$GITHUB_OUTPUT"
          echo "backend_image=$DOCKERHUB_NAMESPACE/skydecor-dubai-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$DOCKERHUB_NAMESPACE/skydecor-dubai-frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.images.outputs.dockerhub_namespace }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          cache-from: type=gha,scope=skydecor-dubai-backend
          cache-to: type=gha,mode=max,scope=skydecor-dubai-backend
          tags: |
            ${{ steps.images.outputs.backend_image }}:${{ github.sha }}
            ${{ steps.images.outputs.backend_image }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./forntend
          file: ./forntend/Dockerfile
          target: production
          push: true
          cache-from: type=gha,scope=skydecor-dubai-frontend
          cache-to: type=gha,mode=max,scope=skydecor-dubai-frontend
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
          tags: |
            ${{ steps.images.outputs.frontend_image }}:${{ github.sha }}
            ${{ steps.images.outputs.frontend_image }}:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: publish
    concurrency:
      group: skydecor-production
      cancel-in-progress: false
    steps:
      - name: Validate deployment secrets
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST_FINGERPRINT: ${{ secrets.EC2_HOST_FINGERPRINT }}
        run: |
          if ! printf '%s' "$EC2_SSH_KEY" | grep -q -- "-----BEGIN .*PRIVATE KEY-----"; then
            echo "EC2_SSH_KEY must contain the complete private key" >&2
            exit 1
          fi

          if [ -z "$EC2_HOST_FINGERPRINT" ]; then
            echo "EC2_HOST_FINGERPRINT secret is required" >&2
            exit 1
          fi

      - name: Deploy release to EC2
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOCKERHUB_USERNAME: ${{ needs.publish.outputs.dockerhub_namespace || 'devil4035' }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          APP_IMAGE: ${{ needs.publish.outputs.backend_image || 'devil4035/skydecor-dubai-backend' }}:${{ github.sha }}
          FRONTEND_IMAGE: ${{ needs.publish.outputs.frontend_image || 'devil4035/skydecor-dubai-frontend' }}:${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GIT_COMMIT_SHA: ${{ github.sha }}
          NGINX_HTTP_PORT: ${{ secrets.PROD_NGINX_HTTP_PORT }}
          MONGO_URI: ${{ secrets.PROD_MONGO_URI }}
          ALLOWED_ORIGINS: ${{ secrets.PROD_ALLOWED_ORIGINS }}
          JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.PROD_JWT_EXPIRES_IN }}
          QR_CODE_CACHE_TTL_SECONDS: ${{ secrets.PROD_QR_CODE_CACHE_TTL_SECONDS }}
          BOOTSTRAP_SUPERADMIN_NAME: ${{ secrets.BOOTSTRAP_SUPERADMIN_NAME }}
          BOOTSTRAP_SUPERADMIN_EMAIL: ${{ secrets.BOOTSTRAP_SUPERADMIN_EMAIL }}
          BOOTSTRAP_SUPERADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_SUPERADMIN_PASSWORD }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
          S3_KEY_PREFIX: ${{ secrets.S3_KEY_PREFIX }}
          S3_PRESIGNED_EXPIRES_SECONDS: ${{ secrets.S3_PRESIGNED_EXPIRES_SECONDS }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,APP_IMAGE,FRONTEND_IMAGE,GITHUB_REPOSITORY,GIT_COMMIT_SHA,NGINX_HTTP_PORT,MONGO_URI,ALLOWED_ORIGINS,JWT_SECRET,JWT_EXPIRES_IN,QR_CODE_CACHE_TTL_SECONDS,BOOTSTRAP_SUPERADMIN_NAME,BOOTSTRAP_SUPERADMIN_EMAIL,BOOTSTRAP_SUPERADMIN_PASSWORD,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,S3_BUCKET,S3_PUBLIC_BASE_URL,S3_KEY_PREFIX,S3_PRESIGNED_EXPIRES_SECONDS
          script: |
            set -eu

            cd /opt/skydecor

            if [ ! -d .git ]; then
              git clone "https://github.com/${GITHUB_REPOSITORY}.git" .
            fi

            git fetch origin "$GIT_COMMIT_SHA"
            git checkout --detach "$GIT_COMMIT_SHA"

            : "${MONGO_URI:?PROD_MONGO_URI secret is required}"
            : "${ALLOWED_ORIGINS:?PROD_ALLOWED_ORIGINS secret is required}"
            : "${JWT_SECRET:?PROD_JWT_SECRET secret is required}"

            printf '%s\n' \
              "PORT=8080" \
              "NGINX_HTTP_PORT=${NGINX_HTTP_PORT:-80}" \
              "NODE_ENV=production" \
              "APP_IMAGE=$APP_IMAGE" \
              "FRONTEND_IMAGE=$FRONTEND_IMAGE" \
              "TRUST_PROXY=1" \
              "MONGO_URI=$MONGO_URI" \
              "ALLOWED_ORIGINS=$ALLOWED_ORIGINS" \
              "JWT_SECRET=$JWT_SECRET" \
              "JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}" \
              "REDIS_URL=redis://redis:6379" \
              "QR_CODE_CACHE_TTL_SECONDS=${QR_CODE_CACHE_TTL_SECONDS:-300}" \
              "BOOTSTRAP_SUPERADMIN_NAME=$BOOTSTRAP_SUPERADMIN_NAME" \
              "BOOTSTRAP_SUPERADMIN_EMAIL=$BOOTSTRAP_SUPERADMIN_EMAIL" \
              "BOOTSTRAP_SUPERADMIN_PASSWORD=$BOOTSTRAP_SUPERADMIN_PASSWORD" \
              "DB_AUTO_INDEX=false" \
              "AWS_REGION=$AWS_REGION" \
              "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" \
              "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" \
              "S3_BUCKET=$S3_BUCKET" \
              "S3_PUBLIC_BASE_URL=$S3_PUBLIC_BASE_URL" \
              "S3_KEY_PREFIX=${S3_KEY_PREFIX:-uploads/images}" \
              "S3_PRESIGNED_EXPIRES_SECONDS=${S3_PRESIGNED_EXPIRES_SECONDS:-300}" \
              > .env.production

            chmod 600 .env.production

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            docker compose -f docker-compose.prod.yaml --env-file .env.production pull
            docker compose -f docker-compose.prod.yaml --env-file .env.production up -d --no-build --remove-orphans --wait --wait-timeout 180

            BASE_URL="http://localhost:${NGINX_HTTP_PORT:-80}"

            curl -fsS -H "Host: skydecor.me" "$BASE_URL/health"
            curl -fsS -H "Host: skydecor.me" "$BASE_URL/ready"
            curl -fsS -H "Host: skydecor.me" "$BASE_URL/" >/dev/null
            curl -fsS -H "Host: skydecor.me" "$BASE_URL/api/v1/products" >/dev/null

            docker image prune -f
            echo "Deploy successfully: $GIT_COMMIT_SHA"
